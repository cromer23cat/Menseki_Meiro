<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menseki Meiro - Escola Sant Salvador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=Patrick+Hand&display=swap');
        
        :root {
            --primary: #4f46e5;
            --accent: #f59e0b;
            --bg-school: #f0f4ff;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: var(--bg-school);
            background-image: 
                radial-gradient(circle at 2px 2px, #d1d5db 1px, transparent 0);
            background-size: 32px 32px;
        }

        .handwritten {
            font-family: 'Patrick+Hand', cursive;
        }

        .school-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .canvas-area {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
            border: 4px solid #e2e8f0;
        }

        .btn-action {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:active {
            transform: scale(0.95);
        }

        .streak-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            color: white;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
        }

        /* Estils per als botons de dificultat */
        .diff-opt {
            border: 2px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .diff-opt.active[data-d="1"] { border-color: #22c55e; background-color: #f0fdf4; color: #15803d; }
        .diff-opt.active[data-d="2"] { border-color: #f59e0b; background-color: #fffbeb; color: #b45309; }
        .diff-opt.active[data-d="3"] { border-color: #ef4444; background-color: #fef2f2; color: #b91c1c; }

        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .correct-anim { animation: celebrate 0.5s ease-in-out; }
    </style>
</head>
<body class="min-h-screen text-slate-800 p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <!-- Banner Escola -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
            <div class="text-center md:text-left">
                <div class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold uppercase tracking-widest mb-2">
                    📍 Albatàrrec
                </div>
                <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">
                    Escola <span class="text-indigo-600">Sant Salvador</span>
                </h1>
                <p class="text-slate-500 font-medium italic">Enigmes de Menseki Meiro per a joves matemàtics</p>
            </div>

            <div class="flex gap-4">
                <div class="streak-badge px-6 py-3 rounded-2xl flex flex-col items-center justify-center">
                    <span class="text-[10px] font-black uppercase opacity-80">Ratxa Actual</span>
                    <span id="streak" class="text-3xl font-black">0</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Tauler de Joc -->
            <div class="lg:col-span-8 space-y-6">
                <div class="school-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <div id="diff-selector" class="flex gap-2">
                            <button onclick="setDifficulty(1)" id="d1" data-d="1" class="diff-opt active px-4 py-2 rounded-xl text-sm font-bold">Fàcil</button>
                            <button onclick="setDifficulty(2)" id="d2" data-d="2" class="diff-opt px-4 py-2 rounded-xl text-sm font-bold">Mig</button>
                            <button onclick="setDifficulty(3)" id="d3" data-d="3" class="diff-opt px-4 py-2 rounded-xl text-sm font-bold">Difícil</button>
                        </div>
                        <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded">DIBUIX A ESCALA 1:1</span>
                    </div>
                    
                    <div class="canvas-area flex justify-center items-center p-4">
                        <canvas id="meiroCanvas" width="600" height="450"></canvas>
                    </div>
                </div>
            </div>

            <!-- Panell Lateral de Resposta -->
            <div class="lg:col-span-4 space-y-6">
                <div class="school-card p-8 flex flex-col h-full border-b-8 border-indigo-500">
                    <h2 class="text-xl font-bold mb-6 text-slate-800 flex items-center gap-2">
                        <span class="bg-indigo-100 p-2 rounded-lg">🤔</span> Quin és el valor?
                    </h2>
                    
                    <div class="space-y-6 flex-grow">
                        <div>
                            <label class="block text-xs font-black text-slate-400 uppercase mb-2 tracking-wide">Escriu el resultat de la X</label>
                            <input type="number" id="userAnswer" 
                                class="w-full bg-slate-50 border-3 border-slate-100 rounded-2xl px-6 py-5 text-4xl font-black text-indigo-600 focus:border-indigo-400 outline-none transition-all placeholder:text-slate-200"
                                placeholder="?">
                        </div>

                        <button onclick="checkAnswer()" class="btn-action w-full bg-indigo-600 hover:bg-indigo-700 text-white py-5 rounded-2xl font-bold text-xl shadow-xl shadow-indigo-200">
                            Comprovar
                        </button>

                        <div id="feedback" class="hidden p-4 rounded-2xl text-center font-bold animate-pop"></div>
                    </div>

                    <div class="mt-8 pt-8 border-t border-slate-100 flex gap-3">
                        <button onclick="generatePuzzle()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-4 rounded-2xl font-bold transition-colors flex items-center justify-center gap-2">
                            <span>🔄</span> Nou puzle
                        </button>
                        <button onclick="toggleHint()" class="bg-amber-100 hover:bg-amber-200 text-amber-700 w-16 rounded-2xl flex items-center justify-center text-xl shadow-sm">
                            💡
                        </button>
                    </div>
                </div>

                <!-- Pista Box -->
                <div id="hintBox" class="hidden school-card p-6 border-l-8 border-amber-400 animate-pop">
                    <p class="text-xs font-black text-amber-600 uppercase mb-2">💡 Una petita ajuda:</p>
                    <p id="hintText" class="handwritten text-lg text-slate-700 leading-snug"></p>
                </div>
            </div>
        </div>

        <footer class="mt-12 text-center">
            <p class="text-slate-400 text-sm font-medium">
                Creat especialment per als alumnes de l'Escola Sant Salvador • Albatàrrec 2024
            </p>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('meiroCanvas');
        const ctx = canvas.getContext('2d');
        const feedback = document.getElementById('feedback');
        const hintBox = document.getElementById('hintBox');
        const hintText = document.getElementById('hintText');
        const userInput = document.getElementById('userAnswer');
        const streakEl = document.getElementById('streak');
        const canvasFrame = document.querySelector('.canvas-area');

        let currentPuzzle = null;
        let difficulty = 1;
        let streak = 0;
        const SCALE = 28; 

        function setDifficulty(d) {
            difficulty = d;
            document.querySelectorAll('.diff-opt').forEach((p, idx) => {
                p.classList.toggle('active', idx + 1 === d);
            });
            generatePuzzle();
        }

        function generatePuzzle() {
            feedback.classList.add('hidden');
            hintBox.classList.add('hidden');
            userInput.value = '';
            
            const types = (difficulty === 1) ? [0, 1] : (difficulty === 2) ? [0, 1, 2] : [1, 2, 3];
            const type = types[Math.floor(Math.random() * types.length)];
            
            switch(type) {
                case 0: createAdjacentPuzzle(); break;
                case 1: createStepPuzzle(); break;
                case 2: createTriplePuzzle(); break;
                case 3: createNestedLPuzzle(); break;
                default: createAdjacentPuzzle();
            }
            drawPuzzle();
        }

        function createAdjacentPuzzle() {
            const h = 4 + Math.floor(Math.random() * 4);
            const w1 = 3 + Math.floor(Math.random() * 3);
            const w2 = 4 + Math.floor(Math.random() * 4);
            currentPuzzle = {
                type: 'adjacent', h, w1, w2, a1: h*w1, a2: h*w2, solution: h*w2,
                hint: `L'altura és la mateixa pels dos. Divideix ${h*w1} entre ${w1} per saber quina és!`
            };
        }

        function createStepPuzzle() {
            const h1 = 5 + Math.floor(Math.random() * 3);
            const w1 = 7 + Math.floor(Math.random() * 3);
            const h2 = 3 + Math.floor(Math.random() * 2);
            const w2 = 4 + Math.floor(Math.random() * 3);
            currentPuzzle = {
                type: 'step', h1, w1, h2, w2, a1: h1*w1, a2: h2*w2, solution: w2,
                hint: `Mira el rectangle de dalt: si l'àrea és ${h2*w2} i l'altura és ${h2}, quant mesura la base X?`
            };
        }

        function createTriplePuzzle() {
            const h = 4 + Math.floor(Math.random() * 3);
            const w1 = 3, w2 = 4, w3 = 5;
            currentPuzzle = {
                type: 'triple', h, w1, w2, w3, a1: h*w1, a2: h*w2, a3: h*w3, solution: h,
                hint: `Tots tres rectangles tenen la mateixa altura X. Tria un on tinguis base i àrea i divideix!`
            };
        }

        function createNestedLPuzzle() {
            const h1 = 9, w1 = 4, h2 = 4, w2 = 10;
            currentPuzzle = {
                type: 'nested', h1, w1, h2, w2, a1: h1*w1, a2: h2*(w2-w1), solution: h1 - h2,
                hint: `L'altura total a l'esquerra és ${h1}. Si el tros de baix mesura ${h2}, quant val el tros de dalt X?`
            };
        }

        function drawPuzzle() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (currentPuzzle.type === 'adjacent') {
                const tw = (currentPuzzle.w1 + currentPuzzle.w2) * SCALE;
                const th = currentPuzzle.h * SCALE;
                const sx = cx - tw/2, sy = cy - th/2;
                drawBox(sx, sy, currentPuzzle.w1 * SCALE, th, currentPuzzle.a1, currentPuzzle.w1, null);
                drawBox(sx + currentPuzzle.w1 * SCALE, sy, currentPuzzle.w2 * SCALE, th, 'X', null, null, '#f0f7ff');
            } else if (currentPuzzle.type === 'step') {
                const w1 = currentPuzzle.w1 * SCALE, h1 = currentPuzzle.h1 * SCALE;
                const w2 = currentPuzzle.w2 * SCALE, h2 = currentPuzzle.h2 * SCALE;
                const sx = cx - w1/2, sy = cy - (h1+h2)/2;
                drawBox(sx, sy + h2, w1, h1, currentPuzzle.a1, currentPuzzle.w1, null);
                drawBox(sx, sy, w2, h2, currentPuzzle.a2, null, h2/SCALE, '#fefce8', 'X');
            } else if (currentPuzzle.type === 'triple') {
                const w = [currentPuzzle.w1, currentPuzzle.w2, currentPuzzle.w3];
                const th = currentPuzzle.h * SCALE;
                const tw = (w[0]+w[1]+w[2]) * SCALE;
                let sx = cx - tw/2, sy = cy - th/2;
                drawBox(sx, sy, w[0]*SCALE, th, currentPuzzle.a1, w[0], null);
                drawBox(sx + w[0]*SCALE, sy, w[1]*SCALE, th, currentPuzzle.a2, w[1], null);
                drawBox(sx + (w[0]+w[1])*SCALE, sy, w[2]*SCALE, th, currentPuzzle.a3, w[2], null);
                ctx.fillStyle = '#4f46e5';
                ctx.font = 'bold 22px Patrick Hand';
                ctx.fillText('X', sx - 30, sy + th/2);
            } else if (currentPuzzle.type === 'nested') {
                const w1 = currentPuzzle.w1 * SCALE, h1 = currentPuzzle.h1 * SCALE;
                const w2 = currentPuzzle.w2 * SCALE, h2 = currentPuzzle.h2 * SCALE;
                const sx = cx - (w2*SCALE)/2, sy = cy - h1/2;
                drawBox(sx, sy, w1, h1, currentPuzzle.a1, currentPuzzle.w1, h1/SCALE);
                drawBox(sx + w1, sy + (h1-h2), (w2-w1/SCALE)*SCALE, h2, currentPuzzle.a2, null, h2/SCALE, '#f0fdf4');
                ctx.fillStyle = '#4f46e5';
                ctx.font = 'bold 22px Patrick Hand';
                ctx.fillText('X', sx + w1 + 25, sy + (h1-h2)/2);
                ctx.strokeStyle = '#4f46e5'; ctx.beginPath(); ctx.moveTo(sx+w1+10, sy); ctx.lineTo(sx+w1+10, sy+h1-h2); ctx.stroke();
            }
        }

        function drawBox(x, y, w, h, area, b, s, fill = '#fff', topLabel = null) {
            ctx.fillStyle = fill;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Text Àrea
            ctx.font = area === 'X' ? 'bold 32px Lexend' : 'bold 24px Patrick Hand';
            ctx.fillStyle = area === 'X' ? '#4f46e5' : '#1e293b';
            ctx.fillText(area + (area === 'X' ? '' : ' cm²'), x + w/2, y + h/2);

            // Text Dimensions
            ctx.font = '16px Lexend';
            ctx.fillStyle = '#64748b';
            if (b) ctx.fillText(b + ' cm', x + w/2, y + h + 25);
            if (s) ctx.fillText(s + ' cm', x - 35, y + h/2);
            if (topLabel) {
                ctx.fillStyle = '#4f46e5';
                ctx.font = 'bold 24px Patrick Hand';
                ctx.fillText(topLabel, x + w/2, y - 20);
            }
        }

        function checkAnswer() {
            const val = parseInt(userInput.value);
            feedback.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
            
            if (val === currentPuzzle.solution) {
                feedback.textContent = "🌟 Excel·lent, Sant Salvador! Resposta correcta.";
                feedback.classList.add('bg-green-100', 'text-green-700', 'correct-anim');
                streak++;
                canvasFrame.style.borderColor = '#22c55e';
                setTimeout(() => canvasFrame.style.borderColor = '#e2e8f0', 1000);
            } else {
                feedback.textContent = "Ooooh! Torna-ho a provar, tu pots!";
                feedback.classList.add('bg-red-100', 'text-red-700');
                streak = 0;
                canvasFrame.style.borderColor = '#ef4444';
                setTimeout(() => canvasFrame.style.borderColor = '#e2e8f0', 1000);
            }
            streakEl.textContent = streak;
        }

        function toggleHint() {
            hintText.textContent = currentPuzzle.hint;
            hintBox.classList.toggle('hidden');
        }

        window.onload = () => setDifficulty(1);
    </script>
</body>
</html>
